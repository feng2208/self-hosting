services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4-slim
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=2aedb9d14caaaaaaaaaaaaaaaaaaaaaa
      - DEFAULT_LOCALE=zh-CN
    restart: unless-stopped

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.20-slim
    volumes:
      - open-terminal:/home/user
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /home/user/project
    environment:
      - OPEN_TERMINAL_API_KEY=28018bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - DEFAULT_LOCALE=zh-CN
    restart: unless-stopped


volumes:
  open-webui:
  open-terminal:
